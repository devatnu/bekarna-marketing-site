name: Deploy

# Builds and publishes the static export to Cloudflare Workers on every push to main.
#
# This exists because there was NO automated deploy. `npm run deploy` had to be run by
# hand from a laptop, so merging a pull request changed the repository and nothing
# else — the live site kept serving whatever was last pushed manually. That is how
# bekarna.app went on showing "This document is not yet in force" for hours after the
# legal documents were written, reviewed and merged.
#
# The app repo does not need this: render.yaml sets `autoDeploy: true`, so Render
# rebuilds from main on its own.
#
# One-time setup — add two repository secrets under
# Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN    a token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID   from the Cloudflare dashboard URL
#
# Until those exist this workflow fails on the deploy step. The build step still runs,
# so a broken build is caught either way.

on:
  push:
    branches: ["main"]
  # Deploy the current main by hand, e.g. to re-publish after a rollback.
  workflow_dispatch:

# One deploy at a time, and never cancel one midway: a half-published set of assets
# is worse than a queued deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Wrangler requires >= 22. Pinning it here rather than relying on the
          # runner's default, which has moved before and will again.
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # `output: "export"` in next.config.ts writes the static site to ./out, which is
      # what wrangler.jsonc points its assets directory at.
      - name: Build
        run: npm run build

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A green `wrangler deploy` does not mean the site is reachable. It exited 0
      # on 2026-08-11 while taking www.bekarna.app off DNS entirely, and nothing
      # noticed until someone opened the link the next morning. Check every hostname
      # wrangler.jsonc claims to serve, so a broken binding fails the run instead of
      # sitting silently in production.
      - name: Verify every hostname serves
        run: |
          attempts=5
          failed=0
          for host in bekarna.app www.bekarna.app; do
            # Retry: a freshly created custom domain needs a moment to propagate,
            # and resolvers may still be holding a negative cache entry from before
            # it existed. curl reports 000 itself when it cannot resolve or connect.
            for attempt in $(seq $attempts); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://$host/" || true)
              [ "$code" = "200" ] && break
              [ "$attempt" = "$attempts" ] && break
              echo "  $host -> ${code:-000} (attempt $attempt/$attempts), retrying in 15s"
              sleep 15
            done
            if [ "$code" = "200" ]; then
              echo "✓ $host -> 200"
            else
              echo "✗ $host -> ${code:-000}"
              failed=1
            fi
          done
          exit $failed
